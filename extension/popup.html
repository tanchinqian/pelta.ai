<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>pelta.ai Prompt Guard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      background: #0a0a0f;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 12px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      background: linear-gradient(135deg, #0f172a 0%, #0a0a0f 100%);
    }

    .logo {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .logo span { color: #6366f1; }

    .status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: #4ade80;
      font-weight: 500;
    }
    .status-dot {
      width: 6px; height: 6px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 6px #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .stat {
      padding: 12px 8px;
      text-align: center;
      border-right: 1px solid rgba(255,255,255,0.07);
    }
    .stat:last-child { border-right: none; }
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 3px;
    }
    .stat-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      font-weight: 600;
    }
    .stat.blocked  .stat-value { color: #f87171; }
    .stat.flagged  .stat-value { color: #fbbf24; }
    .stat.scanned  .stat-value { color: #818cf8; }

    /* ── Feed ── */
    .feed-header-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px 6px;
    }
    .feed-header {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #475569;
      font-weight: 600;
    }
    .feed-clear {
      font-size: 9px;
      color: #6366f1;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .feed-clear:hover { color: #818cf8; }

    .feed { max-height: 280px; overflow-y: auto; }
    .feed::-webkit-scrollbar { width: 4px; }
    .feed::-webkit-scrollbar-track { background: transparent; }
    .feed::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }

    .empty {
      padding: 28px 16px;
      text-align: center;
      color: #334155;
      font-size: 11px;
    }

    .event {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.15s;
    }
    .event:hover { background: rgba(255,255,255,0.03); }
    .event:last-child { border-bottom: none; }

    .event-icon {
      font-size: 13px;
      margin-top: 1px;
      flex-shrink: 0;
    }

    .event-body { flex: 1; min-width: 0; }

    .event-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }

    .verdict-badge {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 1px 5px;
      border-radius: 3px;
    }
    .verdict-block { background: rgba(239,68,68,0.15); color: #f87171; }
    .verdict-flag  { background: rgba(251,191,36,0.15); color: #fbbf24; }
    .verdict-allow { background: rgba(34,197,94,0.12);  color: #4ade80; }

    .event-tool {
      font-size: 9px;
      color: #475569;
      font-weight: 500;
    }
    .event-source-badge {
      font-size: 8px;
      color: #6366f1;
      background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.22);
      border-radius: 3px;
      padding: 1px 4px;
    }
    .event-time {
      font-size: 9px;
      color: #334155;
      margin-left: auto;
      flex-shrink: 0;
    }

    .event-reason {
      font-size: 10px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Footer ── */
    .footer {
      padding: 10px 16px;
      border-top: 1px solid rgba(255,255,255,0.07);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-link {
      font-size: 10px;
      color: #6366f1;
      text-decoration: none;
      cursor: pointer;
    }
    .footer-link:hover { color: #818cf8; }
    .footer-version { font-size: 9px; color: #334155; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">pelta<span>.</span>ai</div>
    <div class="status">
      <span class="status-dot"></span>
      Active
    </div>
  </div>

  <div class="stats">
    <div class="stat blocked">
      <div class="stat-value" id="count-block">0</div>
      <div class="stat-label">Blocked</div>
    </div>
    <div class="stat flagged">
      <div class="stat-value" id="count-flag">0</div>
      <div class="stat-label">Flagged</div>
    </div>
    <div class="stat scanned">
      <div class="stat-value" id="count-total">0</div>
      <div class="stat-label">Scanned</div>
    </div>
  </div>

  <div class="feed-header-wrap">
    <div class="feed-header">Recent activity</div>
    <div class="feed-clear" id="clear-history">Clear</div>
  </div>
  <div class="feed" id="event-feed">
    <div class="empty">No activity yet — start a conversation to begin scanning</div>
  </div>

  <div class="footer">
    <a class="footer-link" id="open-dashboard" href="#">Open dashboard ↗</a>
    <span class="footer-version">v1.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
