<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>pelta.ai — API Base</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #09090b;
      color: #e4e4e7;
      padding: 24px;
      max-width: 420px;
      margin: 0 auto;
    }
    h1 { font-size: 16px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: #3f3f46; }
    .card.active { border-color: #22c55e; background: #0a1a0e; }
    .card-label { font-size: 13px; font-weight: 500; }
    .card-url { font-size: 11px; font-family: monospace; color: #a1a1aa; margin-top: 3px; }
    .check { color: #22c55e; font-weight: 700; font-size: 12px; }
    .section { margin-top: 20px; }
    .section label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #71717a; margin-bottom: 6px; display: block; }
    .row { display: flex; gap: 8px; }
    input {
      flex: 1;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-family: monospace;
      color: #e4e4e7;
      outline: none;
    }
    input:focus { border-color: #bf9143; }
    button {
      background: #bf9143;
      color: #09090b;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #cca054; }
    .status { font-size: 11px; color: #71717a; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>⚙️ pelta.ai — API Target</h1>

  <div class="card" id="local-card">
    <div>
      <div class="card-label">Local Development</div>
      <div class="card-url">http://localhost:3000</div>
    </div>
    <span class="check" id="local-check"></span>
  </div>

  <div class="card" id="prod-card">
    <div>
      <div class="card-label">Production</div>
      <div class="card-url" id="prod-url-display"></div>
    </div>
    <span class="check" id="prod-check"></span>
  </div>

  <div class="section">
    <label>Production URL</label>
    <div class="row">
      <input type="text" id="prod-url-input" placeholder="https://your-app.railway.app" />
      <button id="save-btn">Save</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
